baseURL = "https://example.com/"
languageCode = "en-US"
theme = "hugo-fraktur-theme"
title = "Hugo Fraktur Theme"

[params]
  # Display options
  showIntroContentOnHomepage = true
  showPostsOnHomepage = true

  # --- v1.2: Fonts are now self-hosted (assets/fonts/).
  # Google Fonts no longer required. Remove the params below if migrating.
  # enableGoogleFonts = false

  # --- v1.2: Footer theme attribution (configurable)
  # Displayed as: "Built with Hugo · Theme: <themeName>"
  themeName = "Fraktur"
  themeRepo = "https://github.com/nthnbch/hugo-fraktur-theme"

  # Optional: display a custom build time string in the footer
  # buildTime = "100/100 Lighthouse"

  # Analytics (optional - uncomment to use)
  # google_analytics_id = "G-XXXXXXXXXX"
  # plausible_analytics_domain = "example.com"

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = "Blog"
    identifier = "posts"
    weight = 2
    url = "/posts/"
  [[menu.main]]
    name = "About"
    identifier = "about"
    weight = 3
    url = "/about/"
  [[menu.main]]
    name = "Contact"
    identifier = "contact"
    weight = 4
    url = "/pages/contact/"
