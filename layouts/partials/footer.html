<div class="footer">
  {{ if .Site.Data.social.links }}
  <div class="footer-social">
    {{ range .Site.Data.social.links }}
      <div class="social-link">
        <a href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener">
          {{ .name }}
        </a>
      </div>
    {{ end }}
  </div>
  {{ end }}

  <div class="footer-meta">
    Built with <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a>
    &bull;
    Theme:&nbsp;<a href="{{ .Site.Params.themeRepo | default "https://github.com/nthnbch/hugo-fraktur-theme" }}" target="_blank" rel="noopener">{{ .Site.Params.themeName | default "Fraktur" }}</a>
    {{- with .Site.Params.buildTime }}
    &bull; {{ . }}
    {{- end }}
  </div>
</div>
